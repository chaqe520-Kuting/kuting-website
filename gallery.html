<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活動相簿｜古亭院</title>
<meta name="description" content="古亭院法會活動照片與影片。">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=4">
</head>
<body>
<header id="site-header" class="site-header"></header>
<section class="page-title"><div class="container">
  <h1>活動相簿</h1>
  <p id="gallery-sub">法會與活動的照片、影片紀錄，與大眾分享法喜。</p>
</div></section>
<main class="container">
  <div id="album-index">
    <section class="section">
      <div class="section-head"><h2>照片</h2></div>
      <div class="grid" id="album-grid"></div>
    </section>
    <section class="section">
      <div class="section-head"><h2>影片</h2></div>
      <div class="video-grid" id="video-grid"></div>
    </section>
  </div>
  <div id="album-detail" hidden></div>
</main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片檢視">
  <button class="lb-btn lb-close" type="button" aria-label="關閉">×</button>
  <button class="lb-btn lb-prev" type="button" aria-label="上一張">‹</button>
  <figure><img alt=""><figcaption></figcaption></figure>
  <button class="lb-btn lb-next" type="button" aria-label="下一張">›</button>
</div>
<footer id="site-footer" class="site-footer"></footer>
<script src="data/site.js?v=4"></script>
<script src="data/albums.js?v=4"></script>
<script src="assets/js/common.js?v=4"></script>
<script src="assets/js/gallery.js?v=4"></script>
</body>
</html>
