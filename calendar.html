<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法會行事曆｜古亭院</title>
<meta name="description" content="古亭院年度與每月法會行事曆。">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<section class="page-title"><div class="container">
  <h1>法會行事曆</h1>
  <p>國曆日期旁附農曆。每月農曆初一、十五為例行共修。實際時間以本院公告為準。</p>
</div></section>
<main class="container">
  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button class="btn active" type="button" data-view="month">每月</button>
      <button class="btn" type="button" data-view="year">全年</button>
    </div>
    <div class="month-nav">
      <button class="btn" type="button" id="prev" aria-label="上一個">‹</button>
      <h2 id="period-label"></h2>
      <button class="btn" type="button" id="next" aria-label="下一個">›</button>
    </div>
  </div>
  <div id="view-month">
    <div class="cal-grid" id="cal-grid"></div>
    <div class="month-block"><h3>本月法會</h3><ul class="event-list" id="month-list"></ul></div>
  </div>
  <div id="view-year" hidden></div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="data/site.js"></script>
<script src="data/events.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/calendar.js"></script>
</body>
</html>
