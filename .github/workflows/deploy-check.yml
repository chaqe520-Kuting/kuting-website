# 網頁合併到 main 之後，自動到 kuting.tw 確認新版真的上線了（不用人工打開網頁看版號）
# 成功：在這次執行的摘要寫「已上線」；超過 20 分鐘還沒上線：開 Issue 通知（之後成功會自動關閉）
name: 上線確認

on:
  push:
    branches: [main]
    paths: ["**.html", ".github/workflows/deploy-check.yml", "tools/deploy_check.py"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 等 GitHub Pages 部署，比對 kuting.tw 上的檔案
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python tools/deploy_check.py
      - name: 沒上線就開 Issue／上線了就關掉舊 Issue
        if: always() && steps.check.outcome != 'skipped'
        uses: actions/github-script@v8
        env:
          OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '⚠ 網頁合併後沒有上線';
            const body = fs.existsSync('deploy_report.md') ? fs.readFileSync('deploy_report.md', 'utf8') : '（沒有報告）';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title && !i.pull_request);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const foot = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            if (process.env.OUTCOME === 'success') {
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `已恢復：這次合併已確認上線。\n${run}${foot}` });
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `${body}\n\n${run}${foot}` });
            } else {
              await github.rest.issues.create({ ...context.repo, title, assignees: ['chaqe520-Kuting'], body: `${body}\n\n${run}${foot}` });
            }
