:root{
  --red:#8f1d1d; --red2:#b3261e; --gold:#c9a24b; --gold-l:#f5ecd6;
  --bg:#faf6ee; --card:#fff; --ink:#2b2420; --mute:#7a6e64; --line:#e8dfcf;
  --ok:#2e7d4f; --warn:#c77700; --bad:#c62828; --in:#2e7d4f; --out:#b3261e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;padding:12px 16px calc(12px);padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
header h1{margin:0;font-size:18px;letter-spacing:2px;flex:1}
header .who{font-size:12px;opacity:.85}
.demo{background:#fff3cd;color:#6b4e00;font-size:13px;padding:6px 16px;text-align:center}
main{padding:14px 14px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--red);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.big3 button{border:0;border-radius:14px;padding:18px 4px;font-size:17px;font-weight:700;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px}
.big3 .i{font-size:28px}
.b-in{background:var(--in)} .b-out{background:var(--out)} .b-st{background:#6d4c2f}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:15px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.block{width:100%;padding:13px;font-size:16px}
.btn:disabled{opacity:.45}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.row input{min-width:0;flex:1}
.mute{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 8px;background:var(--gold-l);color:#7a5a12;white-space:nowrap}
.tag.bad{background:#fde7e7;color:var(--bad)} .tag.ok{background:#e5f3ea;color:var(--ok)} .tag.warn{background:#fff1d6;color:var(--warn)}
.tag.in{background:#e5f3ea;color:var(--in)} .tag.out{background:#fde7e7;color:var(--out)} .tag.mv{background:#e6eefb;color:#2856a3} .tag.adj{background:#efe7f7;color:#6a3d9a}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it.click{cursor:pointer}
.qty{font-weight:700;white-space:nowrap;text-align:right}
.qty small{font-weight:400;color:var(--mute)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
textarea{min-height:60px}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.search{position:sticky;top:62px;z-index:3;background:var(--bg);padding-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap}
.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:22px}
.stepper input{text-align:center;font-size:20px;font-weight:700;height:44px;padding:4px}
.stepper .u{width:30px;color:var(--mute);font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet .hd h3{margin:0;font-size:18px;flex:1}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--mute);padding:4px 8px}
.pick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:6px}
.pick div{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.pick div:last-child{border-bottom:0}
.sel{border:2px solid var(--gold);background:var(--gold-l);border-radius:12px;padding:10px 12px;margin-top:6px;display:flex;align-items:center;gap:8px}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.locs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;text-align:left;font-size:15px}
.locs button.on{border:2px solid var(--red);background:#fff5f3}
.locs button small{display:block;color:var(--mute);font-size:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2420;color:#fff;padding:10px 18px;border-radius:999px;z-index:40;font-size:15px;max-width:90vw}
.st-row{border-bottom:1px solid var(--line);padding:10px 0}
.st-row:last-child{border-bottom:0}
.st-in{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-top:6px}
.st-in input{text-align:center;font-weight:700}
.st-row.diff{background:#fff8e6;margin:0 -14px;padding:10px 14px}
.st-row.done .nm::before{content:"✓ ";color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:24px 0}
.login{max-width:380px;margin:40px auto}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:15px}
.kv div:nth-child(odd){color:var(--mute)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.top{position:sticky;top:58px;z-index:3;background:var(--bg);padding:2px 0 4px}
.top input{font-size:17px}
.banner{display:flex;align-items:center;gap:8px;background:#fde7e7;border:1px solid #f3c2c2;color:var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.it.low{box-shadow:inset 4px 0 0 var(--bad);padding-left:10px}
.it.low .qty{color:var(--bad)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:12px;font-size:17px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--red);color:#fff}
.seg button.on.in{background:var(--in)} .seg button.on.out{background:var(--out)}
.seg button:disabled{opacity:.35}
.st-hd{background:#6d4c2f}
.tip{background:var(--gold-l);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;margin-bottom:8px}
.st-in{grid-template-columns:1fr 1fr}
.st-in label{display:flex;align-items:center;gap:6px}
.st-in label span{color:var(--mute);font-size:14px;min-width:20px}
.st-btn{margin-top:4px;border-color:#6d4c2f;color:#6d4c2f;font-weight:700}
a{color:var(--red)}
.it.void{opacity:.5}
.it.void b,.it.void .qty{text-decoration:line-through}
.no{display:inline-block;min-width:22px;font-size:12px;color:var(--mute);font-weight:400;margin-right:4px}
.dt{font-size:12px;margin-top:2px}
.info{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.info span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;color:var(--mute)}
.info b{color:var(--ink);font-weight:600}
.st-in input::placeholder{color:#cfc5b8;font-weight:400}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmt = n => { n = Math.round(num(n)*100)/100; return String(n); };
const pad = n => String(n).padStart(2,'0');
const roc = (ms, withTime) => { const d=new Date(ms); let s=`${d.getFullYear()-1911}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; if(withTime) s+=` ${pad(d.getHours())}:${pad(d.getMinutes())}`; return s; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

function total(it){ let m=0,s=0; for(const v of Object.values(it.stock||{})){ m+=num(v.m); s+=num(v.s);} return {m:Math.round(m*100)/100,s:Math.round(s*100)/100}; }
function qtyText(it, q){ q=q||total(it); let t=`${fmt(q.m)} ${it.unitMain||''}`; if(it.unitSub) t+=` ＋ ${fmt(q.s)} ${it.unitSub}`; return t; }
function isLow(it){ return it.active!==false && it.safety!=null && it.safety!=='' && total(it).m < num(it.safety); }
function itemLocs(it){ return Object.entries(it.stock||{}).filter(([l,v])=>num(v.m)||num(v.s)).map(([l])=>l); }
function activeItems(){ return Object.values(S.items).filter(i=>i.active!==false).sort((a,b)=>num(a.no)-num(b.no)); }
function seedDocs(){
  const now = Date.now(), items=[], txns=[];
  for(const r of SEED_ITEMS){
    const [no,name,cat,unitMain,unitSub,spec,loc,safety,m,s,split]=r;
    const id='i'+String(no).padStart(3,'0');
    items.push({id,no,name,cat,unitMain,unitSub,spec,defaultLoc:loc,safety,note:'',supplier:'',active:true,
      splitPending:!!split, stock:{[loc]:{m,s}}, updatedAt:now});
    txns.push({id:'t'+id,ts:now,type:'init',itemId:id,itemName:name,loc,m,s,purpose:'',note:'期初庫存（115.10.02 盤點）',by:'系統匯入'});
  }
  return {items,txns};
}

  },

/* 共用：把數量變動套到 items（檢查不可為負） */
function applyOps(items, ops){
  for(const o of ops){
    const it=items[o.itemId]; if(!it) throw new Error('找不到品項');
    it.stock=it.stock||{};
    const cur=it.stock[o.loc]||{m:0,s:0};
    const m=Math.round((num(cur.m)+num(o.dm))*100)/100, s=Math.round((num(cur.s)+num(o.ds))*100)/100;
    if(m<0||s<0) throw new Error(`「${it.name}」在「${o.loc}」的數量不足`);
    if(m===0&&s===0&&o.loc!==it.defaultLoc) delete it.stock[o.loc]; else it.stock[o.loc]={m,s};
    it.updatedAt=Date.now();
  }
}

/* ---------------- 資料層：Firebase 雲端模式 ---------------- */
const CloudStore = {
  db:null,
  async start(){
    firebase.initializeApp(FIREBASE_CONFIG);
    this.db=firebase.firestore();
    firebase.auth().onAuthStateChanged(async u=>{
      if(S.settingUp) return;
      if(!u){ S.user=null; this.unsub.forEach(f=>f()); this.unsub=[]; S.needSetup=await Auth.needSetup(); S.ready=true; render(); return; }
      try{
        const d=await this.db.collection('users').doc(u.uid).get();
        if(!d.exists||d.data().active===false){ await firebase.auth().signOut(); S.loginErr='此帳號尚未啟用或已停用，請洽管理者'; render(); return; }
        S.user={uid:u.uid,...d.data()}; S.view='stock';
        this.listen();
      }catch(e){ await firebase.auth().signOut(); S.loginErr='登入失敗：'+e.message; }
    });
  },
  unsub:[],
  listen(){
    const db=this.db; const U=this.unsub;
    U.push(db.collection('items').onSnapshot(q=>{ S.items={}; q.forEach(d=>S.items[d.id]={id:d.id,...d.data()}); S.ready=true; refresh(); }, err));
    U.push(db.collection('meta').doc('config').onSnapshot(d=>{ S.locations=(d.exists&&d.data().locations)||SEED_LOCATIONS.slice(); refresh(); }, err));
    U.push(db.collection('txns').orderBy('ts','desc').limit(300).onSnapshot(q=>{ S.txns=q.docs.map(d=>({id:d.id,...d.data()})); refresh(); }, err));
    U.push(db.collection('stocktakes').orderBy('createdAt','desc').limit(30).onSnapshot(q=>{ S.stocktakes=q.docs.map(d=>({id:d.id,...d.data()})); refresh(); }, err));
    function err(e){ console.error(e); toast('讀取資料失敗：'+e.message); }
  },
  async apply(ops, txns, itemPatches){
    const db=this.db;
    const ids=[...new Set([...ops.map(o=>o.itemId),...Object.keys(itemPatches||{})])];
    await db.runTransaction(async t=>{
      const refs=ids.map(id=>db.collection('items').doc(id));
      const snaps=await Promise.all(refs.map(r=>t.get(r)));
      const items={}; snaps.forEach(s=>{ items[s.id]={id:s.id,...s.data()}; });
      applyOps(items, ops);
      for(const [id,p] of Object.entries(itemPatches||{})) Object.assign(items[id],p);
      ids.forEach((id,k)=>{ const {id:_,...data}=items[id]; t.set(refs[k],data); });
      txns.forEach(x=>{ const {id,...data}=x; t.set(db.collection('txns').doc(id),data); });
    });
  },
  async saveItem(it){ const {id,...d}=it; await this.db.collection('items').doc(id).set(d); },
  async saveLocations(l){ await this.db.collection('meta').doc('config').set({locations:l},{merge:true}); },
  async saveStocktake(st){ const {id,...d}=st; await this.db.collection('stocktakes').doc(id).set(d); },
  async deleteStocktake(id){ await this.db.collection('stocktakes').doc(id).delete(); },
  async queryTxns(from,to){ const q=await this.db.collection('txns').where('ts','>=',from).where('ts','<=',to).orderBy('ts','desc').get(); return q.docs.map(d=>({id:d.id,...d.data()})); },
  async seed(){
    const {items,txns}=seedDocs(); const b=this.db.batch();
    items.forEach(({id,...d})=>b.set(this.db.collection('items').doc(id),d));
    txns.forEach(({id,...d})=>b.set(this.db.collection('txns').doc(id),d));
    b.set(this.db.collection('meta').doc('config'),{locations:SEED_LOCATIONS});
    await b.commit();
  }
};

/* ---------------- 帳號：中文姓名＋個人密碼 ---------------- */
// 姓名會自動轉成系統內部帳號（使用者看不到、也不需要 Email）
// 比照財務儀表板：姓名做 SHA-256 轉成固定的內部帳號，使用者只要輸入「姓名＋自設密碼」
async function nameKey(name){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(name.trim().toLowerCase()));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')+'@gutingyuan-warehouse.local';
}
const DemoAuth = {
  k:'kwh-demo-users',
  all(){ try{ return JSON.parse(localStorage.getItem(this.k)||'[]'); }catch(e){ return this._m||[]; } },
  save(a){ this._m=a; try{ localStorage.setItem(this.k,JSON.stringify(a)); }catch(e){} },
  async needSetup(){ return !this.all().length; },

    S.user={uid:u.uid,name:u.name,admin:u.admin,active:true}; S.view='stock'; try{ sessionStorage.setItem('kwh-demo-session',JSON.stringify(S.user)); }catch(e){} render(); },

  async setUser(uidv,patch){ const a=this.all(); Object.assign(a.find(x=>x.uid===uidv),patch); this.save(a); },
  async changePw(oldPw,newPw){ const a=this.all(); const u=a.find(x=>x.uid===S.user.uid); if(u.pw!==oldPw) throw new Error('目前密碼不正確'); u.pw=newPw; this.save(a); }
};
const CloudAuth = {
  async needSetup(){ try{ const d=await CloudStore.db.collection('meta').doc('setup').get(); return !d.exists; }catch(e){ return false; } },
  async register(name,pw){
    S.settingUp=true;
    try{
      const first=await this.needSetup();
      const cred=await firebase.auth().createUserWithEmailAndPassword(await nameKey(name),pw);
      await cred.user.updateProfile({displayName:name});
      const db=CloudStore.db, b=db.batch();
      b.set(db.collection('users').doc(cred.user.uid),{name,admin:first,active:first,createdAt:Date.now()});
      if(first) b.set(db.collection('meta').doc('setup'),{done:true,at:Date.now()});
      await b.commit();
      if(!first){
        // v1.1：一般帳號註冊後為「待啟用」，需管理者到「設定 → 帳號管理」按「啟用」
        await firebase.auth().signOut(); S.settingUp=false; S.user=null;
        S.loginErr='已註冊「'+name+'」，請等管理者啟用後再登入'; render(); return;
      }
      S.user={uid:cred.user.uid,name,admin:first,active:true}; S.view='stock'; S.settingUp=false;
      CloudStore.listen(); render();
    }catch(e){
      S.settingUp=false;
      if(e.code==='auth/email-already-in-use') throw new Error('這個帳號已經註冊過了，請直接登入');
      if(e.code==='auth/weak-password') throw new Error('密碼太簡單，請至少8個字元');
      throw new Error('註冊失敗，請稍後再試');
    }
  },
  async login(name,pw){
    try{ await firebase.auth().signInWithEmailAndPassword(await nameKey(name),pw); }
    catch(e){
      if(e.code==='auth/user-not-found') throw new Error('找不到這個帳號，請確認姓名或先註冊');
      if(e.code==='auth/wrong-password') throw new Error('密碼錯誤');
      if(e.code==='auth/invalid-credential'||e.code==='auth/invalid-login-credentials') throw new Error('姓名或密碼錯誤，或尚未註冊');
      throw new Error('登入失敗，請稍後再試');
    }
  },
  async logout(){ await firebase.auth().signOut(); },
  async listUsers(){ const q=await CloudStore.db.collection('users').get(); return q.docs.map(d=>({uid:d.id,...d.data()})); },
  async addUser(name,pw,admin){
    // 用第二個連線建立帳號，管理者本身不會被登出
    const sec=firebase.initializeApp(FIREBASE_CONFIG,'sec'+Date.now());
    try{
      const cred=await sec.auth().createUserWithEmailAndPassword(await nameKey(name),pw);
      await cred.user.updateProfile({displayName:name});
      await CloudStore.db.collection('users').doc(cred.user.uid).set({name,admin,active:true,createdAt:Date.now()});
      await sec.auth().signOut();
    }catch(e){ throw new Error(e.code==='auth/email-already-in-use'?'已有同名帳號':(e.code==='auth/weak-password'?'密碼至少要 8 個字元':e.message)); }
    finally{ sec.delete(); }
  },
  async setUser(uidv,patch){ await CloudStore.db.collection('users').doc(uidv).update(patch); },
  async changePw(oldPw,newPw){
    const u=firebase.auth().currentUser;
    try{ await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,oldPw)); }catch(e){ throw new Error('目前密碼不正確'); }
    await u.updatePassword(newPw);
  }
};

/* ---------------- Excel 匯出 ---------------- */
function saveXlsx(sheets, filename){
  if(typeof XLSX==='undefined') return alert('Excel 元件尚未載入，請確認網路連線');
  const wb=XLSX.utils.book_new();
  for(const [name,aoa,cols] of sheets){ const ws=XLSX.utils.aoa_to_sheet(aoa); if(cols) ws['!cols']=cols.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,name); }
  XLSX.writeFile(wb, filename);
}

/* ---------------- 領出／補進（點品項就跳出） ---------------- */
let M=null;
function openMove(id){
  const it=S.items[id]; const has=itemLocs(it);
  M={id,type:'out',m:0,s:0,note:'',loc:null,chgLoc:false,date:isoToday()};
  if(!has.length) M.type='in';
  setLoc(); drawMove();
}
function setLoc(){
  const it=S.items[M.id], has=itemLocs(it);
  if(M.type==='out') M.loc=(S.loc!=='全部'&&has.includes(S.loc))?S.loc:(has.includes(it.defaultLoc)?it.defaultLoc:has[0]);
  else M.loc=(S.loc!=='全部')?S.loc:(it.defaultLoc||S.locations[0]);
}
function drawMove(){
  const it=S.items[M.id], has=itemLocs(it);
  const locOpts=M.type==='out'?has:S.locations;
  const now=Object.entries(it.stock||{}).filter(([,v])=>num(v.m)||num(v.s));
  let h=`<div class="hd"><h3>${esc(it.name)}</h3><button class="x" onclick="closeSheet()">×</button></div>
  <div class="info"><span>項次 <b>${esc(it.no)}</b></span><span>外裝 <b>${esc(it.unitMain)}</b></span>${it.spec?`<span>內箱數量 <b>${esc(it.spec)}</b></span>`:''}<span>存放地點 <b>${esc(locLine(it))}</b></span><span>庫存下限 <b>${it.safety!=null&&it.safety!==''?fmt(it.safety)+' '+esc(it.unitMain):'未設定'}</b></span></div>
  <div class="mute" style="margin-bottom:12px">現有：${now.length?now.map(([l,v])=>`${esc(l)} <b style="color:var(--ink)">${esc(qtyText(it,v))}</b>`).join('　'):'0'}</div>
  <div class="seg">
    <button class="${M.type==='out'?'on out':''}" ${has.length?'':'disabled'} onclick="M.type='out';setLoc();drawMove()">📤 領出</button>
    <button class="${M.type==='in'?'on in':''}" onclick="M.type='in';setLoc();drawMove()">📥 補進</button>
  </div>`;
  if(locOpts.length>1){
    h+= M.chgLoc
      ? `<div class="chips" style="flex-wrap:wrap;margin-top:12px">${locOpts.map(l=>`<button class="${M.loc===l?'on':''}" onclick="M.loc='${esc(l)}';M.chgLoc=false;drawMove()">${esc(l)}</button>`).join('')}</div>`
      : `<div class="mute" style="margin-top:12px">${M.type==='out'?'從':'放到'}：<b style="color:var(--ink)">${esc(M.loc)}</b>　<a href="#" onclick="M.chgLoc=true;drawMove();return false">更改位置</a></div>`;
  }
  h+=`<label class="f">${M.type==='out'?'領出':'補進'}日期</label><input type="date" value="${M.date}" max="${isoToday()}" onchange="M.date=this.value||isoToday()">
  <div style="height:12px"></div>${stepper('m',it.unitMain)}${it.unitSub?`<div style="height:8px"></div>${stepper('s',it.unitSub)}`:''}
  <input type="text" style="margin-top:12px" placeholder="備註（選填，例如：中元法會）" value="${esc(M.note)}" oninput="M.note=this.value">
  <div style="height:14px"></div>
  <button class="btn block" style="color:#fff;font-weight:700;border:0;background:var(--${M.type==='out'?'out':'in'})" onclick="submitMove()">確定${M.type==='out'?'領出':'補進'}</button>`;
  const hist=S.txns.filter(t=>t.itemId===it.id&&!t.void&&(t.type==='in'||t.type==='out')).slice(0,5);
  if(hist.length) h+=`<div class="mute" style="margin-top:16px">最近進出</div><div class="list">${hist.map(t=>`<div class="it" style="padding:6px 0"><span class="tag ${TYPE_CLS[t.type]}">${TYPE_NAME[t.type]}</span><span class="grow">${roc(t.ts)}　${esc(t.loc)}${t.note?'｜'+esc(t.note):''}</span><span class="qty">${t.type==='out'?'−':'＋'}${fmt(t.m)} ${esc(it.unitMain)}${it.unitSub&&num(t.s)?` ${fmt(t.s)} ${esc(it.unitSub)}`:''}</span></div>`).join('')}</div>`;
  sheet(h);
}
function isoToday(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateTs(iso){ if(iso===isoToday()) return Date.now(); const n=new Date(); const d=new Date(iso+'T00:00:00'); d.setHours(n.getHours(),n.getMinutes(),n.getSeconds()); return d.getTime(); }
function stepper(k,u){
  return `<div class="stepper"><button onclick="bump('${k}',-1)">−</button><input type="number" inputmode="decimal" step="any" min="0" id="st_${k}" value="${M[k]}" oninput="M.${k}=num(this.value)"><button onclick="bump('${k}',1)">＋</button><span class="u">${esc(u)}</span></div>`;
}
function bump(k,d){ M[k]=Math.max(0,num(M[k])+d); $('#st_'+k).value=fmt(M[k]); }
async function submitMove(){
  const it=S.items[M.id], m=num(M.m), s=num(M.s);
  if(m<=0&&s<=0) return toast('請輸入數量');
  const sign=M.type==='out'?-1:1;
  const ts=dateTs(M.date);
  const txn={id:uid(),ts,type:M.type,itemId:it.id,itemName:it.name,loc:M.loc,m,s,purpose:'',note:M.note.trim(),by:S.user?.name||''};
  try{
    const k=M.type==='out'?'lastOutAt':'lastInAt';
    await Store.apply([{itemId:it.id,loc:M.loc,dm:sign*m,ds:sign*s}],[txn],{[it.id]:{[k]:Math.max(num(it[k]),ts)}});
    closeSheet(); toast(`✅ ${it.name} ${M.type==='out'?'領出':'補進'} ${fmt(m)} ${it.unitMain}${s?` ${fmt(s)} ${it.unitSub}`:''}`);
    const after=S.items[it.id]; if(M.type==='out'&&after&&isLow(after)) setTimeout(()=>toast(`🔔 ${it.name} 已低於庫存下限，請叫貨`),2300);
  }catch(e){ alert(e.message); }
}

/* ---------------- 盤點（只填不一樣的） ---------------- */
const ST_KEY='kuting-warehouse-st-draft';
let STD={};   // { 'itemId|位置': {m:'',s:''} }
function stLoad(){ try{ STD=JSON.parse(localStorage.getItem(ST_KEY)||'{}'); }catch(e){ STD={}; } }
function stSave(){ try{ localStorage.setItem(ST_KEY,JSON.stringify(STD)); }catch(e){} }
function startSt(){ stLoad(); S.stMode=true; S.stLoc=S.loc!=='全部'?S.loc:S.locations[0]; render(); window.scrollTo(0,0); }
function stItems(loc){
  return activeItems().filter(i=>{ const v=(i.stock||{})[loc];
    return (v&&(num(v.m)||num(v.s))) || i.defaultLoc===loc || (i.splitPending&&(loc==='上倉庫'||loc==='下倉庫')) || Object.keys(STD).includes(i.id+'|'+loc); });
}
function stView(){
  const loc=S.stLoc, rows=stItems(loc);
  const changed=Object.keys(STD).length;

  <main>
    <div class="tip">逐項核對，<b>數量正確就不用填</b>；只有和帳面不一樣的，才填上實際數量。<br>填好的數字會自動保存，可分次盤點。</div>
    <div class="row" style="margin-bottom:8px"><button class="btn sm grow" onclick="impPick()">📥 匯入 Excel 盤點表</button><button class="btn sm grow" onclick="stTemplate()">📄 下載盤點用表格</button></div>
    <div class="chips">${S.locations.map(l=>`<button class="${l===loc?'on':''}" onclick="S.stLoc='${esc(l)}';render()">${esc(l)}</button>`).join('')}</div>
    <div class="card" style="padding:4px 14px">
      ${rows.map(i=>{ const key=i.id+'|'+loc, b=(i.stock||{})[loc]||{m:0,s:0}, a=STD[key];
        return `<div class="st-row ${a?'diff':''}"><div class="row"><div class="grow"><b>${esc(i.name)}</b><div class="mute">帳面 ${esc(qtyText(i,b))}</div></div></div>
        <div class="st-in" style="${i.unitSub?'':'grid-template-columns:1fr'}">
          <label><input type="number" inputmode="decimal" step="any" min="0" placeholder="${fmt(b.m)}" value="${a?esc(a.m):''}" oninput="stSet('${key}','m',this.value,this)"><span>${esc(i.unitMain)}</span></label>
          ${i.unitSub?`<label><input type="number" inputmode="decimal" step="any" min="0" placeholder="${fmt(b.s)}" value="${a?esc(a.s):''}" oninput="stSet('${key}','s',this.value,this)"><span>${esc(i.unitSub)}</span></label>`:''}
        </div></div>`;}).join('')||'<div class="empty">此位置沒有品項</div>'}
      <div style="padding:10px 0"><a href="#" onclick="stAdd();return false">＋ 這裡還有其他品項</a></div>
    </div>
    <button class="btn pri block" onclick="stFinish()">完成盤點（${changed} 項有差異）</button>
    <div style="height:30px"></div>
  </main>`;
}
function stSet(key,k,v,el){
  const a=STD[key]||{m:'',s:''}; a[k]=v;
  if(a.m===''&&a.s==='') delete STD[key]; else STD[key]=a;
  stSave(); el.closest('.st-row').classList.toggle('diff',!!STD[key]);
  const b=document.querySelector('main > .btn.pri'); if(b) b.textContent=`完成盤點（${Object.keys(STD).length} 項有差異）`;
}
function stAdd(){
  sheet(`<div class="hd"><h3>加入品項到「${esc(S.stLoc)}」</h3><button class="x" onclick="closeSheet()">×</button></div>
    <input type="text" placeholder="搜尋品名" oninput="stPick(this.value)"><div class="pick" id="stp"></div>`); stPick('');
}
function stPick(q){
  const cur=new Set(stItems(S.stLoc).map(i=>i.id));
  $('#stp').innerHTML=activeItems().filter(i=>!cur.has(i.id)&&i.name.includes(q.trim())).map(i=>`<div onclick="STD['${i.id}|'+S.stLoc]={m:'',s:''};stSave();closeSheet();render()">${esc(i.name)}</div>`).join('')||'<div class="mute">沒有可加入的品項</div>';
}
function stExit(){ S.stMode=false; S.stSrc=null; render(); toast(Object.keys(STD).length?'已保存，下次可繼續盤點':'已離開盤點'); }
async function stFinish(){
  const now=Date.now(), by=S.user?.name||''; const ops=[], txns=[], result={}, patches={};
  // 每個位置的每個品項都記錄（空白＝與帳面相同），差異的才調整
  for(const loc of S.locations) for(const i of stItems(loc)){
    const key=i.id+'|'+loc, b=(i.stock||{})[loc]||{m:0,s:0}, a=STD[key];
    const am=a&&a.m!==''?num(a.m):num(b.m), as=a&&a.s!==''?num(a.s):num(b.s);
    const dm=Math.round((am-num(b.m))*100)/100, ds=Math.round((as-num(b.s))*100)/100;
    if(!(am||as||num(b.m)||num(b.s))&&!a) continue;
    result[key]={itemId:i.id,name:i.name,loc,bm:num(b.m),bs:num(b.s),am,as,dm,ds};
    if(dm||ds){ ops.push({itemId:i.id,loc,dm,ds}); txns.push({id:uid(),ts:now,type:'adjust',itemId:i.id,itemName:i.name,loc,m:dm,s:ds,purpose:'盤點',note:`${S.stSrc?'Excel 匯入 ':''}帳面 ${fmt(b.m)}/${fmt(b.s)} → 實盤 ${fmt(am)}/${fmt(as)}`,by}); }
    if(i.splitPending) patches[i.id]={splitPending:false};
  }
  if(!confirm(`共有 ${txns.length} 項數量與帳面不同，將自動更正庫存。\n其餘品項視為數量正確。\n\n確定完成盤點？`)) return;
  try{
    await Store.apply(ops,txns,patches);
    const st={id:uid(),createdAt:now,finishedAt:now,status:'done',by,result,...(S.stSrc?{source:S.stSrc}:{})};
    await Store.saveStocktake(st);
    STD={}; stSave(); S.stMode=false; S.stSrc=null; S.view='records'; S.recTab='st'; render();
    toast('盤點完成'); if(confirm('盤點完成！要下載這次的盤點表（Excel）嗎？')) exportStocktake(st.id);
  }catch(e){ alert('完成失敗：'+e.message); }
}

/* ---------------- v1.4：匯入 Excel 盤點表 ---------------- */
// 支援：本平台「盤點用表格」(實盤欄)、庫存總表(庫存欄)、盤點清單(實盤欄)、舊「倉管物料-盤點登記」(取最右邊有填的盤點日期)
// 空白格＝沒點到，維持帳面；存放地點對不到單一位置（例如「上下倉庫」）時以合計比對，差額放在庫存最多的位置
let IMP=null;
const impNorm=v=>String(v??'').normalize('NFKC').replace(/\s+/g,'').replace(/双/g,'雙').replace(/[．・·]/g,'.').toLowerCase();
function impVal(v){ if(v==null) return null; if(typeof v==='number') return isFinite(v)?v:null; const t=String(v).normalize('NFKC').replace(/[,\s]/g,''); if(t===''||t==='-') return null; const n=parseFloat(t); return isFinite(n)&&/^-?[\d.]+/.test(t)?n:null; }
function stTemplate(){
  const aoa=[[`古亭院 倉管物料盤點用表格　${roc(Date.now())}　（實盤欄空白＝數量與帳面相同）`],[],['項次','品名','存放地點','外裝','散裝單位','帳面(外裝)','帳面(散裝)','實盤(外裝)','實盤(散裝)','備註']];
  activeItems().forEach(i=>{
    const locs=Object.entries(i.stock||{}).filter(([l,v])=>num(v.m)||num(v.s)||l===i.defaultLoc);
    (locs.length?locs:[[i.defaultLoc,{m:0,s:0}]]).forEach(([l,v])=>aoa.push([i.no,i.name,l,i.unitMain,i.unitSub||'',num(v.m),i.unitSub?num(v.s):'','','','']));
  });
  saveXlsx([['盤點用表格',aoa,[6,22,10,6,8,10,10,10,10,16]]], `古亭院盤點用表格-${rocFile()}.xlsx`);
}
function impPick(){
  if(typeof XLSX==='undefined') return alert('Excel 元件尚未載入，請確認網路連線');
  const f=document.createElement('input'); f.type='file'; f.accept='.xlsx,.xls,.csv';
  f.onchange=async()=>{ const file=f.files[0]; if(!file) return;
    try{ const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      IMP={file:file.name,wb,sheet:wb.SheetNames.length-1}; impAnalyze(); impShow();
    }catch(e){ alert('讀不到這個檔案：'+e.message); } };
  f.click();
}
// 找表頭與數量欄
function impParse(aoa){
  const cell=(r,c)=>(aoa[r]||[])[c];
  let hr=-1;
  for(let r=0;r<Math.min(aoa.length,20)&&hr<0;r++) if((aoa[r]||[]).some(v=>impNorm(v)==='品名')) hr=r;
  if(hr<0) throw new Error('找不到「品名」欄，請確認是盤點表');
  const width=Math.max(...aoa.slice(hr,hr+40).map(r=>(r||[]).length));
  const nameC=aoa[hr].findIndex(v=>impNorm(v)==='品名');
  let ds=hr+1; while(ds<aoa.length && ds<hr+6 && !(impVal(cell(ds,0))!=null || (cell(ds,nameC)!=null&&String(cell(ds,nameC)).trim()!==''))) ds++;
  const H=[]; for(let c=0;c<width;c++){ let t=''; for(let r=hr;r<ds;r++){ const v=cell(r,c); if(v!=null&&typeof v!=='number') t+=String(v); } H[c]=impNorm(t); }
  const find=f=>H.findIndex(f);
  const noC=find(h=>h==='項次'), locC=find(h=>h.includes('存放')||h.includes('地點')||h==='位置');
  const rows=aoa.slice(ds);
  const hasData=c=>c>=0&&rows.some(r=>impVal((r||[])[c])!=null);
  let mC=-1,sC=-1,label='';
  mC=find(h=>h.includes('實盤')&&!h.includes('散')); sC=find(h=>h.includes('實盤')&&h.includes('散'));
  if(mC>=0) label='「實盤」欄';
  else{
    mC=find(h=>h.includes('庫存')&&h.includes('外裝')); sC=find(h=>h.includes('庫存')&&h.includes('散裝')&&!h.includes('單位'));
    if(mC>=0) label='「庫存」欄';
  }
  if(mC<0){
    const pairs=[]; H.forEach((h,c)=>{ if(h.includes('盤點日期')) pairs.push(c); });
    for(let k=pairs.length-1;k>=0;k--){ const c=pairs[k]; if(hasData(c)||hasData(c+1)){ mC=c; sC=c+1; const d=(H[c].match(/\d{2,3}\.\d{1,2}\.\d{1,2}/)||[])[0]; label=`盤點日期 ${d||'（最右邊有填的那一欄）'}`; break; } }
  }
  if(mC<0){ mC=find(h=>/數量|實際|盤點/.test(h)&&!h.includes('單位')&&!h.includes('內箱')); if(mC>=0){ sC=H.findIndex((h,c)=>c>mC&&h.includes('散')&&!h.includes('單位')); label=`「${aoa[hr][mC]??'數量'}」欄`; } }
  if(mC<0) throw new Error('找不到數量欄（需要「實盤」、「庫存(外裝)」或「盤點日期」欄）');
  const out=[]; let prev=null;
  rows.forEach((r,k)=>{ r=r||[];
    let name=r[nameC]!=null?String(r[nameC]).trim():'';
    const m=impVal(r[mC]), s=sC>=0?impVal(r[sC]):null, loc=locC>=0&&r[locC]!=null?String(r[locC]).trim():'';
    if(!name){ if(prev&&(m!=null||s!=null)&&loc) name=prev; else return; }
    prev=name; out.push({row:ds+k+1,no:noC>=0?r[noC]:'',name,loc,m,s});
  });
  return {rows:out,label};
}
function impAnalyze(){
  const ws=IMP.wb.Sheets[IMP.wb.SheetNames[IMP.sheet]];
  IMP.err=null; IMP.changes=[]; IMP.unmatched=[]; IMP.blank=0; IMP.warn=[]; IMP.matched=0;
  let p; try{ p=impParse(XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true})); }catch(e){ IMP.err=e.message; return; }
  IMP.label=p.label;
  const byName={}; Object.values(S.items).forEach(i=>{ if(i.active!==false) byName[impNorm(i.name)]=i; });
  const locBy={}; S.locations.forEach(l=>locBy[impNorm(l)]=l);
  const per={};   // itemId -> {exact:{loc:{m,s}}, tot:{m,s}}
  const add=(a,v)=>v==null?a:(a==null?v:a+v);
  for(const r of p.rows){
    const it=byName[impNorm(r.name)];
    if(it&&!it.unitSub) r.s=null;   // 沒有散裝單位的品項只看外裝
    if(r.m==null&&r.s==null){ IMP.blank++; continue; }
    if(!it){ IMP.unmatched.push(r); continue; }
    const e=per[it.id]||(per[it.id]={exact:{},tot:null}); const L=locBy[impNorm(r.loc)];
    if(L){ const x=e.exact[L]||(e.exact[L]={m:null,s:null}); x.m=add(x.m,r.m); x.s=add(x.s,r.s); }
    else { const x=e.tot||(e.tot={m:null,s:null,loc:r.loc}); x.m=add(x.m,r.m); x.s=add(x.s,r.s); }
  }
  for(const [id,e] of Object.entries(per)){
    const it=S.items[id]; IMP.matched++;
    const book=l=>(it.stock||{})[l]||{m:0,s:0};
    const target={};   // loc -> {m,s}
    if(Object.keys(e.exact).length){
      if(e.tot) IMP.warn.push(`${it.name}：同時有分位置與合計的列，只採用分位置的數量`);
      for(const [l,x] of Object.entries(e.exact)){ const b=book(l); target[l]={m:x.m??num(b.m),s:x.s??num(b.s),how:''}; }
      for(const [l,v] of Object.entries(it.stock||{})) if(!e.exact[l]&&(num(v.m)||num(v.s))) IMP.warn.push(`${it.name}：「${l}」還有 ${qtyText(it,v)}，盤點表沒列這個位置，維持不變`);
    }else{
      // 合計：差額放在庫存最多的位置（不夠扣再往下一個位置扣）
      const how=e.tot.loc?`「${e.tot.loc}」以合計比對`:'沒有位置，以合計比對';
      for(const k of ['m','s']){
        const nv=e.tot[k]; if(nv==null) continue;
        const ent=Object.entries(it.stock||{}).map(([l,v])=>[l,num(v[k])]).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]);
        let d=Math.round((nv-ent.reduce((a,[,v])=>a+v,0))*100)/100; if(!d) continue;
        if(!ent.length) ent.push([it.defaultLoc||S.locations[0],0]);
        if(d>0){ const l=ent[0][0]; (target[l]||(target[l]={m:num(book(l).m),s:num(book(l).s),how}))[k]=ent[0][1]+d; }
        else for(const [l,v] of ent){ if(!d) break; const take=Math.min(v,-d); d=Math.round((d+take)*100)/100; (target[l]||(target[l]={m:num(book(l).m),s:num(book(l).s),how}))[k]=v-take; }
      }
    }
    for(const [l,t] of Object.entries(target)){ const b=book(l);
      if(Math.round((t.m-num(b.m))*100)||Math.round((t.s-num(b.s))*100)) IMP.changes.push({it,loc:l,bm:num(b.m),bs:num(b.s),am:t.m,as:t.s,how:t.how}); }
  }
  IMP.changes.sort((a,b)=>num(a.it.no)-num(b.it.no));
}
function impShow(){
  const names=IMP.wb.SheetNames, c=IMP.changes||[];
  const q=(it,m,s)=>qtyText(it,{m,s});
  sheet(`<div class="hd"><h3>匯入盤點表</h3><button class="x" onclick="closeSheet()">×</button></div>
    <p class="mute" style="margin:0 0 6px">📄 ${esc(IMP.file)}</p>
    ${names.length>1?`<label class="f">工作表</label><select onchange="IMP.sheet=+this.value;impAnalyze();impShow()">${names.map((n,k)=>`<option value="${k}" ${k===IMP.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}
    ${IMP.err?`<div class="tip" style="background:#fde7e7;color:var(--bad)">${esc(IMP.err)}</div>`:`
    <div class="tip">數量取自：<b>${esc(IMP.label)}</b><br>對到 ${IMP.matched} 項品項，其中 <b>${c.length} 筆和帳面不同</b>${IMP.blank?`；${IMP.blank} 列沒填數量（維持帳面）`:''}。<br>空白格＝沒點到，維持帳面數量。</div>
    ${IMP.unmatched.length?`<div class="tip" style="background:#fde7e7"><b>${IMP.unmatched.length} 列找不到品項，不會匯入：</b><br>${IMP.unmatched.map(r=>`第 ${r.row} 列 ${esc(r.name)}`).join('、')}<br><span class="mute">品名要和平台上的一樣，可到「設定 → 品項」新增或改名後再匯入。</span></div>`:''}
    ${IMP.warn.length?`<div class="tip">${IMP.warn.map(esc).join('<br>')}</div>`:''}
    <div class="card" style="padding:4px 14px;margin:8px 0;max-height:46vh;overflow:auto">${c.length?`<div class="list">${c.map(x=>`<div class="it"><div class="grow"><b>${esc(x.it.name)}</b> <span class="mute">${esc(x.loc)}</span>
      <div class="mute">帳面 ${esc(q(x.it,x.bm,x.bs))} → <b style="color:var(--red)">${esc(q(x.it,x.am,x.as))}</b>${x.how?`<br><small>${esc(x.how)}</small>`:''}</div></div></div>`).join('')}</div>`:'<div class="empty">數量都和帳面相同，不需要更新</div>'}</div>
    ${c.length?`<button class="btn pri block" onclick="impApply(true)">更新庫存（${c.length} 筆）</button>
    <button class="btn block" style="margin-top:8px" onclick="impApply(false)">先帶到盤點畫面核對</button>`:''}`}`);
}
function impApply(now){
  stLoad();
  if(Object.keys(STD).length&&!confirm(`目前有未完成的盤點（${Object.keys(STD).length} 項已填），匯入後會被這份盤點表取代，確定？`)) return;
  STD={}; for(const x of IMP.changes) STD[x.it.id+'|'+x.loc]={m:String(x.am),s:x.it.unitSub?String(x.as):''};
  stSave(); S.stSrc='Excel 匯入：'+IMP.file; S.stLoc=IMP.changes[0].loc; S.stMode=true; closeSheet(); render(); window.scrollTo(0,0);
  if(now) stFinish();
}

/* ---------------- 紀錄 ---------------- */
function recordsView(){
  const d=new Date(); if(!S.recMonth) S.recMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  const seg=`<div class="seg" style="margin-bottom:12px"><button class="${S.recTab==='txn'?'on':''}" onclick="S.recTab='txn';render()">進出紀錄</button><button class="${S.recTab==='st'?'on':''}" onclick="S.recTab='st';render()">盤點紀錄</button></div>`;
  if(S.recTab==='st'){
    const done=S.stocktakes.filter(s=>s.status==='done');
    return seg+`<div class="card" style="padding:4px 14px">${done.length?`<div class="list">${done.map(s=>{const r=Object.values(s.result||{}); const n=r.filter(x=>x.dm||x.ds).length;
      return `<div class="it"><div class="grow"><b>${roc(s.finishedAt)} 盤點</b><div class="mute">${n} 項有差異｜${esc(s.by||'')}${s.source?'｜'+esc(s.source):''}</div></div><button class="btn sm" onclick="exportStocktake('${s.id}')">下載 Excel</button></div>`;}).join('')}</div>`:'<div class="empty">尚無盤點紀錄</div>'}</div>`;
  }
  const [y,m]=S.recMonth.split('-').map(Number);
  S.recFrom=`${S.recMonth}-01`; S.recTo=`${S.recMonth}-${pad(new Date(y,m,0).getDate())}`;
  if(!S.recRows||S.recRows._m!==S.recMonth){ loadRecords(); }
  const rows=(S.recRows||[]).filter(t=>t.type!=='init'&&(!S.recQ||t.itemName.includes(S.recQ)));
  return seg+`<div class="row" style="margin-bottom:10px"><input type="month" value="${S.recMonth}" onchange="S.recMonth=this.value;S.recRows=null;render()"><button class="btn" onclick="exportRecords()">下載 Excel</button></div>
    <div class="mute" style="margin:-4px 0 8px">點「領出／補進」紀錄可以修改或作廢</div>
    <input type="text" placeholder="🔍 依品名篩選" value="${esc(S.recQ)}" onchange="S.recQ=this.value;render()" style="margin-bottom:10px">
    <div class="card" style="padding:4px 14px">${S.recRows?(rows.length?`<div class="list">${rows.map(recRow).join('')}</div>`:'<div class="empty">這個月沒有紀錄</div>'):'<div class="empty">載入中…</div>'}</div>`;
}
function recRow(t){
  const it=S.items[t.itemId]||{}; const sg=t.type==='out'?'−':'＋';
  const v=(x)=>t.type==='adjust'?(x>0?'＋':'')+fmt(x):sg+fmt(x);
  const name={in:'補進',out:'領出',adjust:'盤點更正',move:'移位'}[t.type]||t.type;
  const can=(t.type==='in'||t.type==='out')&&!t.void;
  return `<div class="it ${can?'click':''} ${t.void?'void':''}" ${can?`onclick="openEdit('${t.id}')"`:''}><span class="tag ${t.void?'':TYPE_CLS[t.type]}">${t.void?'已作廢':name}</span><div class="grow"><b>${esc(t.itemName)}</b>${t.edited&&!t.void?' <span class="tag warn">已更正</span>':''}<div class="mute">${roc(t.ts,1)}｜${esc(t.loc)}${t.note?'｜'+esc(t.note):''}｜${esc(t.by||'')}</div>${t.edited?`<div class="mute dt">更正：${esc(t.edited.by||'')} ${roc(t.edited.at,1)}，原為 ${esc(t.edited.was)}</div>`:''}</div>
    ${can?'<span class="mute" style="font-size:18px">✏️</span>':''}<div class="qty">${v(t.m)} ${esc(it.unitMain||'')}${it.unitSub&&num(t.s)?`<br><small>${v(t.s)} ${esc(it.unitSub)}</small>`:''}</div></div>`;
}
/* ---- 修改／作廢進出紀錄 ---- */
let E=null;
function findTxn(id){ return (S.recRows||[]).find(t=>t.id===id)||S.txns.find(t=>t.id===id); }
function txnDesc(t){ const it=S.items[t.itemId]||{}; const d=new Date(t.ts); return `${roc(t.ts)} ${t.loc} ${TYPE_NAME[t.type]} ${fmt(t.m)}${it.unitMain||''}${it.unitSub&&num(t.s)?' '+fmt(t.s)+it.unitSub:''}`; }
function openEdit(id){
  const t=findTxn(id); if(!t) return;
  const d=new Date(t.ts);
  E={id,date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,loc:t.loc,m:num(t.m),s:num(t.s),note:t.note||''};
  drawEdit();
}
function drawEdit(){
  const t=findTxn(E.id), it=S.items[t.itemId]||{unitMain:'',unitSub:''};
  sheet(`<div class="hd"><h3>更正紀錄</h3><button class="x" onclick="closeSheet()">×</button></div>
    <div class="sel" style="margin-bottom:6px"><span class="tag ${TYPE_CLS[t.type]}">${TYPE_NAME[t.type]}</span><div class="grow"><b>${esc(t.itemName)}</b><div class="mute">原紀錄：${esc(txnDesc(t))}</div></div></div>
    <label class="f">日期</label><input type="date" value="${E.date}" max="${isoToday()}" onchange="E.date=this.value||E.date">
    <label class="f">位置</label><div class="chips" style="flex-wrap:wrap">${S.locations.map(l=>`<button class="${E.loc===l?'on':''}" onclick="E.loc='${esc(l)}';drawEdit()">${esc(l)}</button>`).join('')}</div>
    <label class="f">數量</label>
    <div class="stepper"><button onclick="ebump('m',-1)">−</button><input type="number" inputmode="decimal" step="any" min="0" id="ed_m" value="${E.m}" oninput="E.m=num(this.value)"><button onclick="ebump('m',1)">＋</button><span class="u">${esc(it.unitMain)}</span></div>
    ${it.unitSub?`<div style="height:8px"></div><div class="stepper"><button onclick="ebump('s',-1)">−</button><input type="number" inputmode="decimal" step="any" min="0" id="ed_s" value="${E.s}" oninput="E.s=num(this.value)"><button onclick="ebump('s',1)">＋</button><span class="u">${esc(it.unitSub)}</span></div>`:''}
    <label class="f">備註</label><input type="text" value="${esc(E.note)}" oninput="E.note=this.value">
    <div style="height:16px"></div>
    <button class="btn pri block" onclick="saveEdit()">儲存更正</button>
    <div style="height:10px"></div>
    <button class="btn block" style="color:var(--bad);border-color:#f3c2c2" onclick="voidTxn()">🗑 作廢這筆紀錄（登記錯誤、沒有發生）</button>
    <p class="mute">更正或作廢後，庫存數量會自動跟著調整，並保留原紀錄備查。</p>`);
}
function ebump(k,d){ E[k]=Math.max(0,num(E[k])+d); $('#ed_'+k).value=fmt(E[k]); }
async function saveEdit(){
  const t=findTxn(E.id); const m=num(E.m), s=num(E.s);
  if(m<=0&&s<=0) return toast('數量不可為 0；若要取消請按「作廢」');
  const sign=t.type==='out'?-1:1;
  const old=new Date(t.ts); const nd=new Date(E.date+'T00:00:00'); nd.setHours(old.getHours(),old.getMinutes(),old.getSeconds());
  const nt={...t,ts:nd.getTime(),loc:E.loc,m,s,note:E.note.trim(),edited:{at:Date.now(),by:S.user?.name||'',was:txnDesc(t)}};
  if(nt.ts===t.ts&&nt.loc===t.loc&&m===num(t.m)&&s===num(t.s)&&nt.note===(t.note||'')) return closeSheet();
  const ops=[{itemId:t.itemId,loc:t.loc,dm:-sign*num(t.m),ds:-sign*num(t.s)},{itemId:t.itemId,loc:E.loc,dm:sign*m,ds:sign*s}];
  try{ await Store.apply(ops,[nt]); closeSheet(); toast('已更正，庫存已自動調整'); S.recRows=null; render(); }
  catch(e){ alert('無法更正：'+e.message); }
}
async function voidTxn(){
  const t=findTxn(E.id);
  if(!confirm(`確定作廢這筆紀錄？\n${txnDesc(t)}\n\n庫存會${t.type==='out'?'加回':'扣回'}這個數量。`)) return;
  const sign=t.type==='out'?-1:1;
  const nt={...t,void:true,edited:{at:Date.now(),by:S.user?.name||'',was:txnDesc(t)+'（作廢）'}};
  try{ await Store.apply([{itemId:t.itemId,loc:t.loc,dm:-sign*num(t.m),ds:-sign*num(t.s)}],[nt]); closeSheet(); toast('已作廢，庫存已調整'); S.recRows=null; render(); }
  catch(e){ alert('無法作廢：'+e.message); }
}
function filterRec(rows){ return rows.filter(t=>t.type!=='init'&&!t.void); }
async function loadRecords(){
  const mo=S.recMonth; const from=new Date(S.recFrom+'T00:00:00').getTime(), to=new Date(S.recTo+'T23:59:59').getTime();
  try{ const r=await Store.queryTxns(from,to); r._m=mo; S.recRows=r; if(S.view==='records'&&!S.stMode) render(); }catch(e){ alert('查詢失敗：'+e.message); }
}

/* ---------------- 設定 ---------------- */
function adminView(){
  const items=Object.values(S.items).sort((a,b)=>num(a.no)-num(b.no));
  const noSafe=items.filter(i=>i.active!==false&&(i.safety==null||i.safety==='')).length;
  return `<div class="card"><h2>品項<span class="sp"></span><button class="btn pri sm" onclick="openItemEdit()">＋ 新增品項</button></h2>
    ${noSafe?`<p class="mute" style="margin:0 0 6px">有 ${noSafe} 項未設定庫存下限（設定後低於此數量會提醒叫貨）</p>`:''}
    <div class="list">${items.map(i=>`<div class="it click" onclick="openItemEdit('${i.id}')" style="${i.active===false?'opacity:.45':''}">
      <div class="grow"><b>${esc(i.name)}</b><div class="mute">#${esc(i.no)}｜庫存下限：${i.safety!=null&&i.safety!==''?fmt(i.safety)+' '+esc(i.unitMain):'<span style="color:var(--warn)">未設定</span>'}${i.active===false?'｜已停用':''}</div></div><span class="mute">修改 ›</span></div>`).join('')}</div>
  </div>
  <div class="card"><h2>存放位置</h2>
    <div class="list">${S.locations.map((l,k)=>`<div class="it"><div class="grow">${esc(l)}</div><button class="btn sm" onclick="locDel(${k})">刪除</button></div>`).join('')}</div>
    <div class="row" style="margin-top:8px"><input type="text" id="newloc" placeholder="新增位置名稱"><button class="btn pri" onclick="locAdd()">新增</button></div>
  </div>
  <div class="card"><button class="btn block" onclick="exportStock()">下載目前庫存表（Excel）</button></div>
  ${accountCard()}
  ${verFooter()}
  ${CLOUD?'':`<div class="card"><button class="btn block" onclick="if(confirm('清除示範資料並重新載入期初庫存？')){try{localStorage.removeItem(ST_KEY)}catch(e){};DemoStore.resetDemo()}">重設示範資料</button></div>`}`;
}

/* ---------------- 啟動 ---------------- */
render();
Store.start().catch(e=>{ $('#app').innerHTML=`<header style="justify-content:center;padding-top:22px;padding-bottom:22px"><h1 style="font-size:30px;flex:none;text-align:center">古亭院 庫房管理平台</h1></header><div class="card" style="margin:20px">啟動失敗：${esc(e.message)}</div>`; });

</script>
</body>
</html>
